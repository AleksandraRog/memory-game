<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="50%" height="50%">
  <!-- Фон для превью -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(40, 60)">
    <!-- Сегмент 1 -->
    <polygon points="0,280 80,100 200,100 120,280" fill="#FF6D00" opacity="0.85" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Сегмент 2 -->
    <polygon points="80,100 200,100 320,100 200,280" fill="#FF9100" opacity="0.6" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Сегмент 3 -->
    <polygon points="120,280 200,280 320,100 240,280" fill="#FF3D00" opacity="0.95" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Сегмент 4 (диагональная складка) -->
    <polygon points="80,100 120,280 200,280" fill="#FFA726" opacity="0.4" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>
</svg>
