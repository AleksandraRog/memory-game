<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">

  <rect width="200" height="200" fill="#0a0f1d"/>

  <defs>
    <pattern id="tartan" width="200" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">

      <rect x="0" y="20" width="200" height="15" fill="#00ffff" opacity="0.25"/>
      <rect x="20" y="0" width="15" height="200" fill="#00ffff" opacity="0.25"/>

      <rect x="0" y="25" width="200" height="5" fill="#00ffff" opacity="0.4"/>
      <rect x="25" y="0" width="5" height="200" fill="#00ffff" opacity="0.4"/>


      <rect x="0" y="90" width="200" height="25" fill="#ff007f" opacity="0.2"/>
      <rect x="90" y="0" width="25" height="200" fill="#ff007f" opacity="0.2"/>

      <rect x="0" y="100" width="200" height="5" fill="#ff007f" opacity="0.4"/>
      <rect x="100" y="0" width="5" height="200" fill="#ff007f" opacity="0.4"/>


      <rect x="0" y="150" width="200" height="10" fill="#bd00ff" opacity="0.3"/>
      <rect x="150" y="0" width="10" height="200" fill="#bd00ff" opacity="0.3"/>

      <rect x="0" y="27" width="200" height="1" fill="#ffffff" opacity="0.6"/>
      <rect x="27" y="0" width="1" height="200" fill="#ffffff" opacity="0.6"/>
      <rect x="0" y="102" width="200" height="1" fill="#ffffff" opacity="0.6"/>
      <rect x="102" y="0" width="1" height="200" fill="#ffffff" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Заполнение холста диагональным тартаном -->
  <rect width="200" height="500" fill="url(#tartan)"/>
</svg>
