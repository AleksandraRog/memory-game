<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="none" />
  <!-- Trapezoid coordinates: top-left (60,50), top-right (140,50), bottom-right (170,150), bottom-left (30,150) -->
  <!-- Center point at (100,100) -->
  <polygon points="60,50 140,50 100,100" fill="#0066ff" opacity="0.9" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
  <polygon points="140,50 170,150 100,100" fill="#3385ff" opacity="0.7" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
  <polygon points="170,150 30,150 100,100" fill="#0052cc" opacity="0.85" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
  <polygon points="30,150 60,50 100,100" fill="#66a3ff" opacity="0.6" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
</svg>
