<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Фон для превью -->
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(50, 50)">
    <!-- Верхний луч (левая грань) -->
    <polygon points="150,0 150,150 75,75" fill="#FF007F" opacity="0.95" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Верхний луч (правая грань) -->
    <polygon points="150,0 225,75 150,150" fill="#FF4081" opacity="0.75" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Правый луч (верхняя грань) -->
    <polygon points="300,150 150,150 225,75" fill="#F50057" opacity="0.9" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Правый луч (нижняя грань) -->
    <polygon points="300,150 225,225 150,150" fill="#FF80AB" opacity="0.5" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Нижний луч (правая грань) -->
    <polygon points="150,300 150,150 225,225" fill="#C51162" opacity="1.0" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Нижний луч (левая грань) -->
    <polygon points="150,300 75,225 150,150" fill="#FF4081" opacity="0.8" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Левый луч (нижняя грань) -->
    <polygon points="0,150 150,150 75,225" fill="#F50057" opacity="0.85" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Левый луч (верхняя грань) -->
    <polygon points="0,150 75,75 150,150" fill="#FF80AB" opacity="0.6" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
  </g>
</svg>
